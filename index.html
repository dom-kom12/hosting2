<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting Serwera Minecraft</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f1b;
            color: #00ffff;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: #1e1e2f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 300px;
            margin: 0 auto;
        }

        h1 {
            color: #ffcc00;
        }

        button {
            background-color: #00cc66;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #00994d;
        }

        button:disabled {
            background-color: #666;
        }

        #status {
            margin-top: 20px;
            color: #ffcc00;
        }

        #logs {
            margin-top: 30px;
            color: #fff;
            background-color: #333;
            padding: 10px;
            max-height: 200px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hosting Serwera Minecraft</h1>
        <div class="controls">
            <label for="ramAmount">Ilość RAM (GB):</label>
            <input type="number" id="ramAmount" value="2" min="1" max="8" step="1">
            <button id="startButton">Uruchom Serwer</button>
            <button id="stopButton">Zatrzymaj Serwer</button>
        </div>
        <div id="status">
            <h3>Status: <span id="serverStatus">Zatrzymany</span></h3>
        </div>
        <div id="logs"></div>
    </div>

    <script>
        let serverRunning = false;  // Zmienna do przechowywania statusu serwera

        document.getElementById('startButton').addEventListener('click', startServer);
        document.getElementById('stopButton').addEventListener('click', stopServer);

        function startServer() {
            const ramAmount = document.getElementById('ramAmount').value;
            if (serverRunning) {
                document.getElementById('logs').textContent = "Serwer jest już uruchomiony.";
                return;
            }

            fetch('http://localhost:3000/start')
                .then(response => response.text())
                .then(data => {
                    serverRunning = true;
                    document.getElementById('serverStatus').textContent = 'Uruchomiony';
                    document.getElementById('logs').textContent = `Serwer Minecraft uruchomiony z ${ramAmount}GB RAM.`;
                    document.getElementById('startButton').disabled = true;
                    document.getElementById('stopButton').disabled = false;
                })
                .catch(error => {
                    document.getElementById('logs').textContent = `Wystąpił błąd: ${error}`;
                });
        }

        function stopServer() {
            if (!serverRunning) {
                document.getElementById('logs').textContent = "Serwer nie jest uruchomiony.";
                return;
            }

            fetch('http://localhost:3000/stop')
                .then(response => response.text())
                .then(data => {
                    serverRunning = false;
                    document.getElementById('serverStatus').textContent = 'Zatrzymany';
                    document.getElementById('logs').textContent = "Serwer Minecraft został zatrzymany.";
                    document.getElementById('startButton').disabled = false;
                    document.getElementById('stopButton').disabled = true;
                })
                .catch(error => {
                    document.getElementById('logs').textContent = `Wystąpił błąd: ${error}`;
                });
        }
    </script>
</body>
</html>
