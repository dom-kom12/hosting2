<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uruchom Serwer Minecraft</title>
    <script>
        function startServer() {
            fetch('https://replit.com/@komputer200012/CourageousLegalQueryoptimizer#index.js/start', {
                method: 'POST', // lub GET w zależności od konfiguracji
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ramAmount: document.getElementById('ramAmount').value,
                    jarFile: document.getElementById('jarFile').value
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Serwer uruchomiony:', data);
                alert('Serwer Minecraft został uruchomiony!');
            })
            .catch(error => {
                console.error('Błąd:', error);
                alert('Wystąpił błąd podczas uruchamiania serwera.');
            });
        }
    </script>
</head>
<body>
    <h1>Uruchom serwer Minecraft</h1>
    <input type="text" id="ramAmount" placeholder="Ilość RAM (GB)">
    <input type="text" id="jarFile" placeholder="Nazwa pliku .jar">
    <button onclick="startServer()">Uruchom serwer</button>
</body>
</html>
