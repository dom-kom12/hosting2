<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uruchom Serwer Minecraft</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f1b;
            color: #00ffff;
            padding: 20px;
        }
        button {
            background-color: #00ffff;
            border: none;
            color: black;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 5px 0;
        }
        button:hover {
            background-color: #0099cc;
        }
    </style>
</head>
<body>
    <h1>Uruchom Serwer Minecraft</h1>
    <label for="ramAmount">Ilość RAM (GB): </label>
    <input type="number" id="ramAmount" placeholder="Np. 2" required>
    <br>
    <label for="jarFile">Nazwa pliku .jar: </label>
    <input type="text" id="jarFile" placeholder="Np. minecraft_server.jar" required>
    <br>
    <button id="startServerButton">Uruchom serwer</button>

    <h2>Logi:</h2>
    <pre id="logContainer" style="background-color: #222; color: white; padding: 10px; height: 200px; overflow-y: scroll;">
    </pre>

    <script>
        // Funkcja do uruchamiania serwera Minecraft
function startServer() {
    const ramAmount = document.getElementById('ramAmount').value;
    const jarFile = document.getElementById('jarFile').value;
    const logContainer = document.getElementById('logContainer');

    // Sprawdzanie, czy wszystkie dane zostały wprowadzone
    if (!ramAmount || !jarFile) {
        alert("Proszę wprowadzić zarówno ilość RAM, jak i nazwę pliku .jar");
        return;
    }

    // Logowanie uruchamiania serwera w konsoli
    logContainer.textContent = `Uruchamiam serwer Minecraft z plikiem ${jarFile} i przydzieloną pamięcią RAM: ${ramAmount}...`;

    // Wysyłanie żądania do backendu na Replit
    fetch('https://twoj-backend-na-replit.repl.co/start', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            ramAmount: ramAmount,
            jarFile: jarFile
        })
    })
    .then(response => response.json())
    .then(data => {
        // Pokazywanie odpowiedzi z backendu
        logContainer.textContent += `\nSerwer Minecraft został uruchomiony z ${ramAmount} GB RAM i plikiem ${jarFile}.`;
    })
    .catch(error => {
        // Obsługa błędów
        logContainer.textContent += `\nWystąpił błąd: ${error.message}`;
    });
}

// Inicjalizacja
document.getElementById('startServerButton').addEventListener('click', startServer);

    </script>
</body>
</html>
