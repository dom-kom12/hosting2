import fetch from "node-fetch"; // Upewnij się, że masz zainstalowaną paczkę node-fetch (npm install node-fetch)

async function getHTML(url) {
    try {
        // Sprawdzamy, czy URL jest prawidłowy
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`Błąd pobierania pliku: ${response.statusText}`);
        }

        const text = await response.text();
        console.log(text); // Wyświetlamy pobrany HTML w konsoli
    } catch (error) {
        console.error(`Wystąpił błąd: ${error.message}`);
    }
}

// Funkcja uruchamiająca serwer Minecraft
function startServer() {
    const ramAmount = document.getElementById("ramAmount").value;
    const jarFile = document.getElementById("jarFile").value;
    const logContainer = document.getElementById("logContainer");
    const logOutput = document.getElementById("logOutput");

    // Logika uruchamiania serwera
    logOutput.textContent = `Uruchamiam serwer Minecraft z plikiem ${jarFile} i przydzieloną pamięcią RAM: ${ramAmount}...`;

    // Możesz tu dodać kod, który będzie komunikować się z serwerem, uruchamiając go w tle, np. za pomocą Node.js i child_process

    // Przykład: Odczyt i zapis do logów
    logContainer.scrollTop = logContainer.scrollHeight;
    logOutput.textContent += "\nSerwer jest uruchamiany...";

    // Przykład uruchamiania strony na Vercel (Używamy funkcji getHTML)
    const url =
        "https://hosting2-git-main-dominks-projects-3910b586.vercel.app/index.html";
    getHTML(url);
}

// Funkcja do przełączania trybu nocnego
function toggleNightMode() {
    const nightModeButton = document.getElementById("nightMode");
    const body = document.body;

    nightModeButton.classList.toggle("active");
    if (nightModeButton.classList.contains("active")) {
        body.style.backgroundColor = "#222";
        body.style.color = "#fff";
    } else {
        body.style.backgroundColor = "#0f0f1b";
        body.style.color = "#00ffff";
    }
}
