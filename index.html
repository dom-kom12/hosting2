<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Minecraft</title>
    <style>
        body {
            background-color: #0f0f1b;
            color: #00ffff;
            font-family: Arial, sans-serif;
        }

        #nightMode.active {
            background-color: #222;
            color: #fff;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #logContainer {
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
            background-color: #222;
            color: #fff;
            padding: 10px;
        }

        #logOutput {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>Serwer Minecraft - Panel Zarządzania</h1>

    <button id="nightMode">Przełącz tryb nocny</button>
    <button id="startServer">Uruchom Serwer</button>

    <div id="logContainer">
        <pre id="logOutput">Logi...</pre>
    </div>

    <script>
      // Funkcja do przełączania trybu nocnego
function toggleNightMode() {
    const nightModeButton = document.getElementById('nightMode');
    const body = document.body;

    nightModeButton.classList.toggle('active');
    if (nightModeButton.classList.contains('active')) {
        body.style.backgroundColor = "#222";
        body.style.color = "#fff";
        localStorage.setItem('nightMode', 'true');
    } else {
        body.style.backgroundColor = "#0f0f1b";
        body.style.color = "#00ffff";
        localStorage.setItem('nightMode', 'false');
    }
}

// Funkcja do uruchamiania serwera Minecraft
function startServer() {
    const logContainer = document.getElementById('logContainer');
    const logOutput = document.getElementById('logOutput');

    logOutput.textContent = "Uruchamiam serwer Minecraft...";

    // Wysłanie żądania POST do backendu, aby uruchomić serwer
    fetch('/start-server', {
        method: 'POST'
    })
    .then(response => response.text())
    .then(data => {
        logOutput.textContent += "\n" + data;
    })
    .catch(error => {
        logOutput.textContent += "\nBłąd: " + error;
    });

    // Przewijanie logów na dół
    logContainer.scrollTop = logContainer.scrollHeight;
}

// Inicjalizacja aplikacji
window.onload = function() {
    // Sprawdzanie, czy tryb nocny jest aktywowany
    const isNightMode = localStorage.getItem('nightMode') === 'true';
    if (isNightMode) {
        document.getElementById('nightMode').classList.add('active');
        document.body.style.backgroundColor = "#222";
        document.body.style.color = "#fff";
    }

    // Event listener do przycisku "Przełącz tryb nocny"
    document.getElementById('nightMode').addEventListener('click', toggleNightMode);

    // Event listener do przycisku "Uruchom Serwer"
    document.getElementById('startServer').addEventListener('click', startServer);
}

    </script>
</body>
</html>
